services:
  postgres:
    image: postgres:17-alpine
    container_name: sdp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sdp_tool
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - sdp_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sdp_tool"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sdp_postgres_data:
